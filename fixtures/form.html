<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Synthetic form</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; }
      label { display: block; margin-top: 1rem; }
      input, select { width: 100%; padding: 0.4rem; }
      button { margin-top: 1.5rem; padding: 0.5rem 1rem; }
    </style>
  </head>
  <body>
    <h1>Contact (synthetic)</h1>
    <form id="demo" action="#" method="post">
      <label>Name <input name="name" id="name" autocomplete="name" /></label>
      <label>Email <input name="email" id="email" type="email" autocomplete="email" /></label>
      <label>Topic
        <select name="topic" id="topic">
          <option value="general">General</option>
          <option value="support">Support</option>
        </select>
      </label>
      <button type="submit" id="submit">Submit application</button>
    </form>
    <p id="status" hidden>Submitted (demo only)</p>
    <script>
      document.getElementById("demo").addEventListener("submit", (e) => {
        e.preventDefault();
        document.getElementById("status").hidden = false;
      });
    </script>
  </body>
</html>
